[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1",
    "email-validator>=2.2",
    "fastapi[standard]>=0.163.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.10,<3",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a separate PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
