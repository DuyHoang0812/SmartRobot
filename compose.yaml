
name: smartrobot-fastapi

services:
  postgres:
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_DB: smartrobot
      POSTGRES_USER: smartrobot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartrobot -d smartrobot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
